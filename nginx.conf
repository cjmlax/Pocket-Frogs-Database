server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # For any path that isn't a real file, serve index.html so React Router
    # can handle the route client-side instead of nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively — Vite fingerprints filenames on build
    # so old files are never accidentally served after an update.
    location ~* \.(?:js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
